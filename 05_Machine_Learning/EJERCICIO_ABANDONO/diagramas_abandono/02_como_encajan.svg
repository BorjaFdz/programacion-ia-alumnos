="400" height="136" rx="18" fill="#FFF0E8" stroke="#FFF0E8" stroke-width="2"/><text x="1029.0" y="796.68" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A1C">CV para cada una</text><text x="1001.515625" y="838.42" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">Comparar la AUC media</text><rect x="1390" y="742" width="400" height="136" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="1447.5" y="796.68" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A1C">Mejor configuración</text><text x="1429.0" y="838.42" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">Reajuste con todo TRAIN</text><polyline points="920,810 955,810" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="955,810 941.4932934647098,816.5244830116685 941.4932934647098,803.4755169883315" fill="#FF4500"/><polyline points="1355,810 1390,810" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1390,810 1376.49329346471,816.5244830116685 1376.49329346471,803.4755169883315" fill="#FF4500"/><rect x="100" y="950" width="1720" height="180" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="125" y="1003.73" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#FF4500">IMBALANCED-LEARN</text><text x="125" y="1056.24" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">Añadir remuestreo</text><rect x="520" y="972" width="400" height="136" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="588.5" y="1026.68" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1A1A1C">Preprocesamiento</text><text x="596.5" y="1068.42" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">Aprendido con train</text><rect x="955" y="972" width="400" height="136" rx="18" fill="#FFF0E8" stroke="#FFF0E8" stroke-wi