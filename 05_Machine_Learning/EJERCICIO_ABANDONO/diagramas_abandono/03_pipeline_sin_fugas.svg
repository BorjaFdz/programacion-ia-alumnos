<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><rect x="0" y="0" width="1920" height="1440" rx="0" fill="#FAFAFC" stroke="#FAFAFC" stroke-width="2"/><text x="100" y="85.24" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF4500">03  /  NIVEL 3 · DENTRO DEL PIPELINE</text><text x="100" y="161.8" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1A1A1C">¿Qué aprende cada entrenamiento?</text><text x="100" y="214.07" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Este recorrido se repite desde cero en cada fold y con cada configuración.</text><rect x="100" y="1400" width="1720" height="3" rx="0" fill="#B7BCC5" stroke="#B7BCC5" stroke-width="2"/><text x="100" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">borjafernandez.es  ·  Machine Learning aplicado  ·  Abandono sin leakage</text><text x="1700" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">03 / 06</text><rect x="100" y="255" width="1170" height="85" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="328.5" y="305.90000000000003" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">Datos originales del entrenamiento del fold</text><polyline points="685,340 685,385" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,385 678.4755169883315,371.49329346470984 691.5244830116685,371.49329346470984" fill="#FF4500"/><rect x="100" y="385" width="1170" height="115" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="476.5" y="429.79" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">1. Imputación por grupos</text><text x="255.5" y="474.11" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Edad → mediana por situación laboral · Horas → mediana por plan</text><polyline points="685,500 685,530 375,530 375,570" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="375,570 368.47551698833155,556.4932934647098 381.52448301166845,556.4932934647098" fill="#FF4500"/><polyline points="685,530 995,530 995,570" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="995,570 988.4755169883315,556.4932934647098 1001.5244830116685,556.4932934647098" fill="#FF4500"/><rect x="100" y="570" width="550" height="155" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="257.0" y="617.44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">2A. Numéricas</text><text x="223.0" y="661.4100000000001" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Otros nulos → mediana</text><text x="282.5" y="695.6300000000001" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">SimpleImputer</text><rect x="720" y="570" width="550" height="155" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="866.5" y="617.44" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">2B. Categóricas</text><text x="894.5" y="661.4100000000001" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Nulos → «otra»</text><text x="891.0" y="695.6300000000001" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">OneHotEncoder</text><polyline points="375,725 375,760 685,760 685,800" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,800 678.4755169883315,786.4932934647098 691.5244830116685,786.4932934647098" fill="#FF4500"/><polyline points="995,725 995,760 685,760" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,760 698.5067065352902,753.4755169883315 698.5067065352902,766.5244830116685" fill="#FF4500"/><rect x="100" y="800" width="1170" height="105" rx="18" fill="#FFF0E8" stroke="#B7BCC5" stroke-width="2"/><text x="457.0" y="840.14" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">3. StandardScaler · opcional</text><text x="211.5" y="883.28" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">Se usa en Regresión Logística y KNN; se omite en Árbol y Random Forest.</text><polyline points="685,905 685,950" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,950 678.4755169883315,936.4932934647098 691.5244830116685,936.4932934647098" fill="#FF4500"/><rect x="100" y="950" width="1170" height="105" rx="18" fill="#FFF0E8" stroke="#B7BCC5" stroke-width="2"/><text x="466.5234375" y="989.5500000000001" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">4. SMOTETomek · opcional</text><text x="289.5" y="1033.52" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Solo en la variante con balanceo, dentro de imblearn.Pipeline.</text><polyline points="685,1055 685,1100" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,1100 678.4755169883315,1086.49329346471 691.5244830116685,1086.49329346471" fill="#FF4500"/><rect x="100" y="1100" width="1170" height="100" rx="18" fill="#E6F4ED" stroke="#226244" stroke-width="2"/><text x="569.5" y="1137.64" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">5. Clasificador</text><text x="284.0" y="1180.78" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">Regresión Logística · Árbol de Decisión · KNN · Random Forest</text><rect x="1410" y="255" width="410" height="330" rx="18" fill="#FFF0E8" stroke="#FF4500" stroke-width="2"/><text x="1525.0" y="336.14" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1C">Durante fit</text><text x="1504.5" y="381.64" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Se aprenden las</text><text x="1435.5" y="417.03999999999996" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">medianas, las categorías y</text><text x="1494.0" y="452.44" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">los parámetros de</text><text x="1477.5" y="487.84" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">escalado solo con el</text><text x="1436.0" y="523.24" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">entrenamiento de ese fold.</text><rect x="1410" y="650" width="410" height="360" rx="18" fill="#F2F2F2" stroke="#B7BCC5" stroke-width="2"/><text x="1481.515625" y="710.26" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">Validación y test</text><text x="1520.5" y="755.06" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Se aplican las</text><text x="1479.0" y="790.4599999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">transformaciones ya</text><text x="1535.5" y="825.8599999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">aprendidas.</text><text x="1615.0" y="861.2599999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F"></text><text x="1502.0" y="896.66" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">No se recalculan</text><text x="1462.5" y="932.06" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">estadísticas ni se hace</text><text x="1534.5" y="967.4599999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">remuestreo.</text><rect x="100" y="1260" width="1720" height="105" rx="18" fill="#FFF0E8" stroke="#FFF0E8" stroke-width="2"/><text x="125" y="1300.07" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#FF4500">Pipeline = preparación + modelo, ajustados como una sola unidad.</text><text x="125" y="1340.24" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#1A1A1C">X_train llega a CV y GridSearchCV sin imputar, codificar ni escalar fuera del pipeline.</text></svg>