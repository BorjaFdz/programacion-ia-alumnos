<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><rect x="0" y="0" width="1920" height="1440" rx="0" fill="#FAFAFC" stroke="#FAFAFC" stroke-width="2"/><text x="100" y="85.24" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF4500">06  /  NIVEL 4 · BALANCEO DENTRO DEL FOLD</text><text x="100" y="161.8" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1A1A1C">¿Dónde entra imbalanced-learn?</text><text x="100" y="214.07" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">GridSearchCV → CV → imblearn.Pipeline → SMOTETomek → clasificador</text><rect x="100" y="1400" width="1720" height="3" rx="0" fill="#B7BCC5" stroke="#B7BCC5" stroke-width="2"/><text x="100" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">borjafernandez.es  ·  Machine Learning aplicado  ·  Abandono sin leakage</text><text x="1700" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">06 / 06</text><rect x="100" y="255" width="800" height="100" rx="18" fill="#FFF0E8" stroke="#FF4500" stroke-width="2"/><text x="248.015625" y="292.53" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1C">ENTRENAMIENTO DEL FOLD</text><text x="403.0" y="337.2" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">4 de los 5 folds</text><rect x="1020" y="255" width="800" height="100" rx="18" fill="#F2F2F2" stroke="#B7BCC5" stroke-width="2"/><text x="1213.03125" y="292.53" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1C">VALIDACIÓN DEL FOLD</text><text x="1323.0" y="337.2" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">1 de los 5 folds</text><polyline points="500,355 500,400" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="500,400 493.47551698833155,386.49329346470984 506.52448301166845,386.49329346470984" fill="#FF4500"/><polyline points="1420,355 1420,400" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1420,400 1413.4755169883315,386.49329346470984 1426.5244830116685,386.49329346470984" fill="#FF4500"/><rect x="100" y="400" width="800" height="135" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="328.0" y="437.44000000000005" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">Ajustar y transformar</text><text x="214.5" y="481.41" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Imputación + one-hot + escalado si procede.</text><text x="275.0" y="515.6300000000001" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Las estadísticas se aprenden aquí.</text><rect x="1020" y="400" width="800" height="135" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="1283.5" y="437.44000000000005" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">Solo transformar</text><text x="1171.0" y="481.41" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Usar lo que aprendió el entrenamiento.</text><text x="1272.0" y="515.6300000000001" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Sin fit sobre validación.</text><polyline points="500,535 500,575" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="500,575 493.47551698833155,561.4932934647098 506.52448301166845,561.4932934647098" fill="#FF4500"/><polyline points="1420,535 1420,575" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1420,575 1413.4755169883315,561.4932934647098 1426.5244830116685,561.4932934647098" fill="#FF4500"/><rect x="100" y="575" width="800" height="195" rx="18" fill="#FFF0E8" stroke="#FF4500" stroke-width="2"/><text x="270.5234375" y="623.5600000000001" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1A1A1C">SMOTETomek · fit_resample</text><text x="201.0" y="668.36" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">SMOTE: crea ejemplos sintéticos de la clase</text><text x="425.0" y="703.76" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">minoritaria.</text><text x="200.0234375" y="739.16" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Tomek: limpia pares fronterizos entre clases.</text><rect x="1020" y="575" width="800" height="195" rx="18" fill="#F2F2F2" stroke="#B7BCC5" stroke-width="2"/><text x="1293.5" y="622.03" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">Sin remuestreo</text><text x="1135.5" y="668.01" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#57575F">Conservar las filas y las clases originales</text><text x="1308.5" y="704.59" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#57575F">de la validación.</text><text x="1226.015625" y="741.17" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#57575F">En TEST se hace lo mismo.</text><polyline points="500,770 500,825" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="500,825 493.47551698833155,811.4932934647098 506.52448301166845,811.4932934647098" fill="#FF4500"/><polyline points="1420,770 1420,825" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1420,825 1413.4755169883315,811.4932934647098 1426.5244830116685,811.4932934647098" fill="#FF4500"/><rect x="100" y="825" width="800" height="125" rx="18" fill="#E6F4ED" stroke="#226244" stroke-width="2"/><text x="319.0" y="874.1999999999999" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">Ajustar el clasificador</text><text x="195.5" y="919.3499999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Aprende con el entrenamiento remuestreado.</text><rect x="1020" y="825" width="800" height="125" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="1236.0" y="874.1999999999999" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">Predecir en validación</text><text x="1206.5" y="919.3499999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Usar el clasificador ya ajustado.</text><polyline points="900,887 1020,887" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1020,887 1006.4932934647098,893.5244830116685 1006.4932934647098,880.4755169883315" fill="#FF4500"/><polyline points="1420,950 1420,1005" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1420,1005 1413.4755169883315,991.4932934647098 1426.5244830116685,991.4932934647098" fill="#FF4500"/><rect x="100" y="1005" width="1720" height="115" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="498.0078125" y="1049.2" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">Calcular AUC en validación y repetir en el siguiente fold</text><text x="367.5" y="1094.3500000000001" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">El balanceo se evalúa como parte del pipeline; se compara con la variante sin balanceo.</text><rect x="100" y="1180" width="1720" height="170" rx="18" fill="#FFF0E8" stroke="#FFF0E8" stroke-width="2"/><text x="125" y="1225.73" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#FF4500">Matiz del notebook: SMOTE se aplica después del one-hot.</text><text x="125" y="1274.07" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#1A1A1C">Puede crear valores intermedios en columnas categóricas. Para una aplicación real, valorar</text><text x="125" y="1308.29" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#1A1A1C">SMOTENC con un pipeline adaptado o ponderación de clases.</text></svg>