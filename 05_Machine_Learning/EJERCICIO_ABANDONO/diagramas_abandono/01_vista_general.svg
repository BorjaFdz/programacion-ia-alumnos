<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><rect x="0" y="0" width="1920" height="1440" rx="0" fill="#FAFAFC" stroke="#FAFAFC" stroke-width="2"/><text x="100" y="85.24" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF4500">01  /  NIVEL 1 · EL PROCESO COMPLETO</text><text x="100" y="161.8" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1A1A1C">¿Qué hacemos en general?</text><text x="100" y="214.07" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Objetivo: predecir si un cliente abandonará la formación.</text><rect x="100" y="1400" width="1720" height="3" rx="0" fill="#B7BCC5" stroke="#B7BCC5" stroke-width="2"/><text x="100" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">borjafernandez.es  ·  Machine Learning aplicado  ·  Abandono sin leakage</text><text x="1700" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">01 / 06</text><rect x="100" y="255" width="1170" height="100" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="440.5" y="292.29" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">1. Cargar y explorar los datos</text><text x="285.0" y="336.61" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Conocer las variables, los nulos y la distribución de abandona.</text><polyline points="685,355 685,395" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,395 678.4755169883315,381.49329346470984 691.5244830116685,381.49329346470984" fill="#FF4500"/><rect x="100" y="395" width="1170" height="110" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="471.0" y="437.29" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">2. Limpiar con reglas fijas</text><text x="248.0" y="481.61" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Duplicados, rangos, coherencia, tarifas y variables que se excluyen.</text><polyline points="685,505 685,545" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,545 678.4755169883315,531.4932934647098 691.5244830116685,531.4932934647098" fill="#FF4500"/><rect x="100" y="545" width="1170" height="100" rx="18" fill="#FFF0E8" stroke="#FF4500" stroke-width="2"/><text x="512.0" y="582.29" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">3. Separar train / test</text><text x="449.5" y="626.61" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Split estratificado · random_state=42</text><polyline points="685,645 685,690" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,690 678.4755169883315,676.4932934647098 691.5244830116685,676.4932934647098" fill="#FF4500"/><polyline points="1270,595 1615,595 1615,690" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1615,690 1608.4755169883315,676.4932934647098 1621.5244830116685,676.4932934647098" fill="#FF4500"/><rect x="100" y="690" width="1170" height="105" rx="18" fill="#FFF0E8" stroke="#FF4500" stroke-width="2"/><text x="576.5" y="729.79" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">TRAIN · 80 %</text><text x="313.5" y="774.11" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Aquí se comparan modelos y se buscan hiperparámetros.</text><rect x="1410" y="690" width="410" height="270" rx="18" fill="#F2F2F2" stroke="#B7BCC5" stroke-width="2"/><text x="1506.0" y="759.3199999999999" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1C">TEST · 20 %</text><text x="1500.5" y="805.52" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Reservado hasta</text><text x="1490.0" y="840.92" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">la evaluación final.</text><text x="1615.0" y="876.3199999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F"></text><text x="1466.515625" y="911.7199999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">No decide el ganador.</text><polyline points="685,795 685,840" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,840 678.4755169883315,826.4932934647098 691.5244830116685,826.4932934647098" fill="#FF4500"/><rect x="100" y="840" width="1170" height="125" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="433.0" y="889.79" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">4. Comparar con CV de 5 folds</text><text x="182.5234375" y="934.11" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Modelos base → Grid Search sin balanceo → Grid Search con SMOTETomek</text><polyline points="685,965 685,1010" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,1010 678.4755169883315,996.4932934647098 691.5244830116685,996.4932934647098" fill="#FF4500"/><rect x="100" y="1010" width="1170" height="110" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="360.5078125" y="1052.29" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">5. Elegir por la mejor AUC media de CV</text><text x="348.5078125" y="1096.61" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">best_estimator_ ya está reajustado con todo TRAIN.</text><polyline points="685,1120 685,1165" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="685,1165 678.4755169883315,1151.49329346471 691.5244830116685,1151.49329346471" fill="#FF4500"/><rect x="100" y="1165" width="1170" height="115" rx="18" fill="#E6F4ED" stroke="#226244" stroke-width="2"/><text x="328.5" y="1209.79" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">6. Evaluar el ganador una sola vez en TEST</text><text x="284.515625" y="1254.11" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">AUC, accuracy, informe de clasificación y matriz de confusión.</text><polyline points="1615,960 1615,1222 1270,1222" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1270,1222 1283.50670653529,1215.4755169883315 1283.50670653529,1228.5244830116685" fill="#FF4500"/><text x="1450" y="1124.07" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#FF4500">Solo al final</text><rect x="1410" y="255" width="410" height="250" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="1492.0" y="317.6" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1C">Excluir el futuro</text><text x="1441.5" y="360.04" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">estado_cuenta_31_octubre</text><text x="1504.5" y="393.08000000000004" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">revela abandona.</text><text x="1510.0" y="426.12" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">Se elimina antes</text><text x="1497.0" y="459.16" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#57575F">del entrenamiento.</text><text x="100" y="1344.07" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Las estadísticas de imputación, codificación y escalado se aprenden dentro del pipeline.</text></svg>