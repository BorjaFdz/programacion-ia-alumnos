<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440"><rect x="0" y="0" width="1920" height="1440" rx="0" fill="#FAFAFC" stroke="#FAFAFC" stroke-width="2"/><text x="100" y="85.24" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF4500">05  /  NIVEL 4 · BÚSQUEDA DE HIPERPARÁMETROS</text><text x="100" y="161.8" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1A1A1C">Grid Search: una CV por cada combinación</text><text x="100" y="214.07" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">Ejemplo real del notebook: KNN. El criterio de selección es scoring=&quot;roc_auc&quot;.</text><rect x="100" y="1400" width="1720" height="3" rx="0" fill="#B7BCC5" stroke="#B7BCC5" stroke-width="2"/><text x="100" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">borjafernandez.es  ·  Machine Learning aplicado  ·  Abandono sin leakage</text><text x="1700" y="1426.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#57575F">05 / 06</text><rect x="100" y="255" width="1720" height="115" rx="18" fill="#FFF0E8" stroke="#FF4500" stroke-width="2"/><text x="735.0" y="298.5" font-family="Arial, sans-serif" font-size="37" font-weight="700" fill="#1A1A1C">1. Definir la rejilla de KNN</text><text x="422.5" y="346.01000000000005" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#57575F">6 valores de n_neighbors × 2 de weights × 2 de metric = 24 combinaciones</text><polyline points="960,370 960,395 480,395 480,420" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="480,420 473.47551698833155,406.49329346470984 486.52448301166845,406.49329346470984" fill="#FF4500"/><rect x="100" y="420" width="760" height="150" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="260.5234375" y="464.0" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">2. Tomar una combinación</text><text x="288.5" y="509.15" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Ej.: k=5 · weights=&quot;distance&quot;</text><text x="347.5" y="544.55" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">metric=&quot;manhattan&quot;</text><polyline points="860,495 1020,495" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1020,495 1006.4932934647098,501.52448301166845 1006.4932934647098,488.47551698833155" fill="#FF4500"/><rect x="1020" y="420" width="800" height="150" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="1173.0" y="464.0" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">3. Evaluarla con CV de 5 folds</text><text x="1170.5" y="509.15" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Cinco ajustes completos del pipeline.</text><text x="1176.0" y="544.55" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">Cada uno aprende solo con su train.</text><polyline points="1420,570 1420,620 960,620 960,665" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="960,665 953.4755169883315,651.4932934647098 966.5244830116685,651.4932934647098" fill="#FF4500"/><rect x="100" y="665" width="1720" height="110" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="644.0" y="706.35" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1C">4. Repetir para las 24 combinaciones</text><text x="435.53125" y="752.6800000000001" font-family="Arial, sans-serif" font-size="31" font-weight="400" fill="#57575F">Guardar la AUC de cada fold y calcular la AUC media de cada combinación.</text><polyline points="960,775 960,825" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="960,825 953.4755169883315,811.4932934647098 966.5244830116685,811.4932934647098" fill="#FF4500"/><rect x="100" y="825" width="1720" height="110" rx="18" fill="#E6F4ED" stroke="#226244" stroke-width="2"/><text x="614.0078125" y="866.9399999999999" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1C">5. Elegir la mayor AUC media y reajustar</text><text x="363.515625" y="912.4399999999999" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#57575F">refit=True por defecto → el pipeline ganador de esa búsqueda se ajusta con todo TRAIN.</text><polyline points="960,935 960,980 520,980 520,1025" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="520,1025 513.4755169883315,1011.4932934647098 526.5244830116685,1011.4932934647098" fill="#FF4500"/><polyline points="960,980 1430,980 1430,1025" fill="none" stroke="#FF4500" stroke-width="4" stroke-linejoin="round"/><polygon points="1430,1025 1423.4755169883315,1011.4932934647098 1436.5244830116685,1011.4932934647098" fill="#FF4500"/><rect x="100" y="1025" width="820" height="150" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="274.0" y="1087.29" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">best_params_ y best_score_</text><text x="202.5390625" y="1131.61" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">La combinación elegida y su AUC media de CV.</text><rect x="1020" y="1025" width="800" height="150" rx="18" fill="#FFFFFF" stroke="#B7BCC5" stroke-width="2"/><text x="1287.0" y="1087.29" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#1A1A1C">best_estimator_</text><text x="1095.5078125" y="1131.61" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#57575F">El pipeline ganador ya reajustado con todo TRAIN.</text><rect x="100" y="1235" width="1720" height="105" rx="18" fill="#FFF0E8" stroke="#FFF0E8" stroke-width="2"/><text x="125" y="1275.07" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#FF4500">En esta búsqueda de KNN: 24 × 5 = 120 ajustes de CV + 1 reajuste.</text><text x="125" y="1315.24" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#1A1A1C">Se comparan 8 búsquedas: 4 familias × 2 variantes. El TEST mide al ganador final.</text></svg>